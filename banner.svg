<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Saad Chaib, DevOps and backend engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1e"/>
      <stop offset="0.55" stop-color="#121d3d"/>
      <stop offset="1" stop-color="#0e2a3a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#326ce5" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#326ce5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#4d8bff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <style>
      .sans { font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
      .mono { font-family: Consolas, "SF Mono", Menlo, "DejaVu Sans Mono", monospace; }
      .blink { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .row { opacity: 0; animation: appear 0.5s ease forwards; }
      .r1 { animation-delay: 0.4s; } .r2 { animation-delay: 0.8s; } .r3 { animation-delay: 1.2s; }
      .r4 { animation-delay: 1.6s; } .r5 { animation-delay: 2.0s; }
      @keyframes appear { to { opacity: 1; } }
    </style>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="18" fill="url(#glow)"/>

  <text x="64" y="118" class="sans" font-size="54" font-weight="700" fill="#eef3fb" letter-spacing="-1">Saad Chaib</text>
  <rect x="66" y="138" width="88" height="4" rx="2" fill="url(#accent)"/>
  <text x="64" y="184" class="sans" font-size="23" fill="#c9d5ea">DevOps &amp; Backend Engineer</text>
  <text x="64" y="216" class="sans" font-size="16" fill="#8a9bb8">Computer engineering, EHTP 2026 · Morocco</text>

  <g class="mono" font-size="13">
    <rect x="64" y="244" width="104" height="30" rx="15" fill="#326ce5" fill-opacity="0.16" stroke="#326ce5" stroke-opacity="0.5"/>
    <text x="116" y="264" text-anchor="middle" fill="#9cbcff">Kubernetes</text>
    <rect x="178" y="244" width="78" height="30" rx="15" fill="#5eead4" fill-opacity="0.1" stroke="#5eead4" stroke-opacity="0.45"/>
    <text x="217" y="264" text-anchor="middle" fill="#8ff3e2">Python</text>
    <rect x="266" y="244" width="64" height="30" rx="15" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-opacity="0.45"/>
    <text x="298" y="264" text-anchor="middle" fill="#fcd27a">Java</text>
    <rect x="340" y="244" width="98" height="30" rx="15" fill="#a78bfa" fill-opacity="0.12" stroke="#a78bfa" stroke-opacity="0.45"/>
    <text x="389" y="264" text-anchor="middle" fill="#cbbafd">Terraform</text>
    <rect x="448" y="244" width="78" height="30" rx="15" fill="#f87171" fill-opacity="0.1" stroke="#f87171" stroke-opacity="0.45"/>
    <text x="487" y="264" text-anchor="middle" fill="#fca5a5">Argo CD</text>
  </g>

  <g transform="translate(640 48)">
    <rect width="500" height="224" rx="14" fill="#0b1222" stroke="#22304d"/>
    <rect width="500" height="34" rx="14" fill="#0e172b"/>
    <rect y="20" width="500" height="14" fill="#0e172b"/>
    <circle cx="20" cy="17" r="5.5" fill="#ff5f57"/>
    <circle cx="38" cy="17" r="5.5" fill="#febc2e"/>
    <circle cx="56" cy="17" r="5.5" fill="#28c840"/>
    <text x="78" y="21" class="mono" font-size="12" fill="#6b7d9c">saad@platform: ~</text>

    <g class="mono" font-size="14">
      <text x="20" y="66" class="row r1"><tspan fill="#5eead4">$</tspan><tspan fill="#dbe4f3"> kubectl get deploy</tspan></text>
      <text x="20" y="94" class="row r2" fill="#6b7d9c">NAME             READY   STATUS</text>
      <text x="20" y="118" class="row r3"><tspan fill="#dbe4f3">greenwindow      1/1     </tspan><tspan fill="#4ade80">Running</tspan></text>
      <text x="20" y="142" class="row r4"><tspan fill="#dbe4f3">payflow-web      2/2     </tspan><tspan fill="#4ade80">Running</tspan></text>
      <text x="20" y="166" class="row r5"><tspan fill="#dbe4f3">corebank         2/2     </tspan><tspan fill="#4ade80">Running</tspan></text>
      <text x="20" y="200"><tspan fill="#5eead4">$</tspan><tspan fill="#dbe4f3"> </tspan><tspan class="blink" fill="#5eead4">▌</tspan></text>
    </g>
  </g>
</svg>
